name: Tests

# These widgets are plain static files with no build step, so nothing else would
# catch a broken page until someone loaded it in a browser. The suites parse the
# real markup with jsdom and click the real buttons.
#
# They also exist because the suite was unrunnable for a while without anyone
# noticing: jsdom was never declared as a dependency, so `require("jsdom")` only
# resolved by accident from a parent directory. Running it from a clean checkout
# is what keeps that honest.
#
# --offline skips the three suites that reach a third party: live_smoke (the
# Pages site) and the kicker/D-ST backtests (live Sleeper stats). A third party
# being down should not turn this red. None of the three is silently dropped:
# the backtests run in their own non-fatal step, and live_smoke runs in the
# `live` job on a daily schedule, against the deployed site rather than this
# checkout.
on:
  push:
    branches: [master]
    paths:
      - 'lineup/**'
      - 'nfl-props/**'
      - 'books/**'
      # The suites import three scrapers directly -- collapse_guard covers the
      # Kalshi and Odds API collapse floors, td_conversion the anytime-TD
      # conversion. Without this path they were edited and pushed without ever
      # running the tests that cover them, which is how this session changed
      # fetch_oddsapi_weekly_props.py with no CI run against it.
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

  # Once a day, check the DEPLOYED site rather than the checkout. Deliberately
  # not part of the push job: Pages publishes asynchronously, so running it there
  # would probe the PREVIOUS deployment and report on code that is no longer
  # live. A schedule also catches the failure this cannot otherwise see -- a data
  # refresh that stops committing, leaving the pages serving stale or absent
  # feeds while every push-triggered run stays green.
  schedule:
    - cron: '0 13 * * *'

jobs:
  widgets:
    # The checkout suites have nothing to say about a scheduled run.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund

      - name: Run the test suites
        run: node tests/run_all.js --offline

      # Needs a real browser: only an engine applies media queries and measures
      # layout. Chrome is installed rather than assumed at a path, because the
      # test skips when the binary is missing and a wrong guess would verify
      # nothing while still reporting success.
      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Check mobile layout at phone widths
        run: node tests/mobile_layout.test.js
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      # The model backtests read live Sleeper stats, so --offline leaves them
      # out of the step above and they need their own. Non-fatal on purpose:
      # Sleeper being unreachable is not a defect in this repo, and these two
      # are the only suites that depend on a third party.
      #
      # They still speak up. dst_model exits 1 under CI when the stats exist but
      # no game lines are posted, rather than skipping quietly -- a scheduled run
      # that verifies nothing is the thing worth knowing about. Read the outcome
      # in the summary below, because a red cross here does not fail the job.
      - name: Backtest the kicker and D/ST models (non-fatal)
        id: backtests
        continue-on-error: true
        run: |
          node tests/kicker_model.test.js
          node tests/dst_model.test.js

      - name: Report the backtest outcome
        if: always()
        run: |
          {
            echo "### Model backtests"
            echo ""
            echo "outcome: \`${{ steps.backtests.outcome }}\`"
            echo ""
            if [ "${{ steps.backtests.outcome }}" != "success" ]; then
              echo "Non-fatal, but worth a look: either Sleeper was unreachable"
              echo "or a model baseline drifted. The step log has the numbers."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Is the published site actually serving data? Each probe counts something only
  # the feeds can render, so an empty board fails rather than passing on markup.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Smoke-test the published pages
        run: node tests/live_smoke.test.js

name: NFL Beat Digest

on:
  # Times chosen from measured publication volume across all 123 sources
  # (items/hour ET, sampled 2026-08-02): the day is quiet until ~09:00, peaks
  # hard at 12:00-13:00 (102 and 90 items), stays high through 16:00, and falls
  # off after 18:00.
  schedule:
    # 12:00 UTC = 08:00 EDT. Morning read of everything filed overnight.
    - cron: '0 12 * * *'
    # 17:00 UTC = 13:00 EDT. Catches the noon-1pm peak, when morning practice
    # has wrapped and beat writers file their reports. Biggest window of the day.
    - cron: '0 17 * * *'
    # 21:00 UTC = 17:00 EDT. Late pass for afternoon sessions and roster moves.
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The UD ADP history lives in the EZ Dubs repo. It is public, so a plain
      # curl is enough -- no token, no checkout. If the fetch fails, run.py
      # degrades to projections-only rather than failing the job.
      - name: Fetch UD ADP history
        continue-on-error: true
        run: |
          mkdir -p external
          curl -sSfL --retry 3 --retry-delay 5 \
            https://raw.githubusercontent.com/pjmerica/ez-dubs-website/main/dashboards/best-ball-prices/ud_adp_history.csv \
            -o external/ud_adp_history.csv
          # Surface the newest snapshot date: the digest rolls forward to it, so
          # if this stops advancing the upstream EZ Dubs pull has stalled.
          echo "rows: $(wc -l < external/ud_adp_history.csv)"
          echo "newest ADP snapshot: $(cut -d, -f1 external/ud_adp_history.csv | tail -n +2 | sort -u | tail -1)"

      # The @32BeatWriters RSS window only exposes ~12 authors at a time, so the
      # roster in data/writers.json accumulates across runs rather than arriving
      # complete. Merges by default; never drops a reporter who was just quiet.
      - name: Discover beat writers
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python nfl-beat/scripts/discover_writers.py --polls 3 --delay 30

      - name: Build digest
        env:
          # players.py checks this before falling back to the local Documents path.
          UD_ADP_PATH: external/ud_adp_history.csv
          PYTHONIOENCODING: utf-8
        run: python nfl-beat/scripts/run.py

      - name: Commit digest
        run: |
          git config user.name  "nfl-beat-bot"
          git config user.email "nfl-beat-bot@users.noreply.github.com"
          git add nfl-beat/digests nfl-beat/index.html nfl-beat/data/writers.json
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
            exit 0
          fi
          git commit -m "Auto: NFL beat digest $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; rebasing on remote."
            git pull --rebase --autostash origin master
          done
          echo "Push failed after 5 attempts." >&2
          exit 1

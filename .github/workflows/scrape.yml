name: Scrape Markets

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # allow manual run from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and match markets
        run: node scripts/scrape.js

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arbitrage/data.json
          git diff --staged --quiet || git commit -m "chore: refresh market data [skip ci]"
          # Another workflow pushing to master mid-run rejects a bare push and
          # the freshly scraped data dies with the runner. nfl-beat.yml already
          # retried for this; these two did not, and a manual run of props and
          # scrape together lost a complete props refresh (7 files, run
          # 38509417273) to exactly that race. The data had been collected and
          # committed -- only the push failed.
          #
          # These commits touch disjoint paths, so a rebase is safe: props owns
          # nfl-props/, scrape owns arbitrage/.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; rebasing on remote."
            git pull --rebase --autostash origin master
          done
          echo "Push failed after 5 attempts." >&2
          exit 1

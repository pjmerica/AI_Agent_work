name: NFL closing-lines archive

# Files each finished week's closing lines beside the actual results
# (nfl-props/archive/<season>/week-NN.json) and rescores every archived week
# (scorecard.json). See scripts/build_lines_archive.py.
#
# Costs no Odds API credits: the lines come from this repo's own git history
# (every props refresh is a commit), the results from Sleeper and ESPN.
#
# Tuesday, after Monday night's game: the week is complete. Friday: Sleeper's
# stat corrections land mid-week, so the last two weeks are rebuilt again
# (a week is rebuilt for 14 days after its last game, then left alone).
on:
  schedule:
    - cron: '0 12 * * 2'     # Tue  8:00am ET
    - cron: '0 12 * * 5'     # Fri  8:00am ET
  workflow_dispatch:
    inputs:
      weeks:
        description: "Rebuild these weeks (e.g. 1-9). Blank = weeks finished in the last 14 days."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: nfl-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # the closing lines are read from git history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the week files
        env:
          WEEKS: ${{ inputs.weeks }}
        run: |
          if [ -n "$WEEKS" ]; then
            python scripts/build_lines_archive.py --weeks "$WEEKS"
          else
            python scripts/build_lines_archive.py
          fi

      - name: Score every archived week
        run: python scripts/score_lines_archive.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl-props/archive/
          git diff --staged --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "chore: archive NFL closing lines and results [skip ci]"
          # Same race as nfl-props.yml: another workflow may push mid-run.
          # This job only touches nfl-props/archive/, so a rebase is safe.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; rebasing on remote."
            git pull --rebase --autostash origin master
          done
          echo "Push failed after 5 attempts." >&2
          exit 1

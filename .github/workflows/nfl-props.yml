name: NFL Projections Scraper

on:
  # Times are ET in these comments, UTC in the expressions (GitHub schedules in
  # UTC and ignores DST), matching the convention in nfl-beat.yml. Written for
  # EDT = UTC-4; once EST returns in November each run lands an hour earlier in
  # ET, which does not matter for a morning refresh.
  #
  # The cadence follows how books actually post, which is very uneven: almost
  # nothing for Sunday is up on Monday or Tuesday, Wednesday evening is when it
  # starts, and Thursday is the single biggest jump of the week (week 3 went 99
  # to 183 player-games overnight). There is no point refreshing early in the
  # week -- see the coverage note on the page.
  #
  # Cost: a single-week run measured 36 Odds API credits (19,920 -> 19,884 on
  # 2026-10-06), so eight runs a week is ~290/week, ~1,250/month. A scheduled run
  # leaves `inputs` empty, so the multiweek step (gated on `if: inputs.multiweek`,
  # ~64 credits) stays manual-only and never fires on a schedule.
  #
  # If the quota ever does run short, drop the Friday and Saturday runs first:
  # those two days move the least, because Thursday night is when the Sunday
  # props actually open.
  schedule:
    - cron: '0 2 * * 4'      # Wed 10:00pm ET — books start opening Sunday props
    - cron: '0 14 * * 4'     # Thu 10:00am ET — morning pass
    - cron: '0 19 * * 4'     # Thu  3:00pm ET — afternoon pass
    - cron: '0 23 * * 4'     # Thu  7:00pm ET — before TNF; biggest jump of the week
    - cron: '0 14 * * 5'     # Fri 10:00am ET
    - cron: '0 14 * * 6'     # Sat 10:00am ET
    - cron: '0 14 * * 0'     # Sun 10:00am ET — pre-kickoff
    - cron: '0 16 * * 0'     # Sun 12:00pm ET — last look before the 1pm games
  workflow_dispatch:   # also runnable by hand from the Actions UI
    inputs:
      multiweek:
        description: "Also refresh the weeks-1-4 average (costs ~50 Odds API credits)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps for Clay PDF parser
        run: pip install pdfplumber

      - name: Scrape FantasyPros consensus projections
        run: python scripts/fetch_nfl_projections.py

      - name: Scrape Mike Clay projections (ESPN PDF)
        run: python scripts/fetch_clay_projections.py
        continue-on-error: true

      # Season-long market lines. Both are best-effort: FanDuel's public endpoint
      # can change without notice, and Kalshi markets close once the season ends.
      - name: Scrape FanDuel season-long props
        run: python scripts/fetch_vegas_season_props.py
        continue-on-error: true

      - name: Scrape Kalshi season-long markets
        run: python scripts/fetch_kalshi_season_props.py
        continue-on-error: true

      # Bovada is the only book here quoting season receiving TDs, which is what
      # lets most first-round RBs score on the Market Points tab.
      - name: Scrape Bovada season-long props
        run: python scripts/fetch_bovada_season_props.py
        continue-on-error: true

      # Per-game markets for the upcoming slate. Kalshi purges settled markets,
      # so this always fetches the next week's games.
      - name: Scrape Kalshi per-game (weekly) props
        run: python scripts/fetch_kalshi_weekly_props.py
        continue-on-error: true

      # DraftKings anytime-TD. Free, no key, but needs Origin+Referer headers
      # or every request 403s. Covers 429 players to Kalshi's 236.
      - name: Scrape DraftKings TD scorers
        run: python scripts/fetch_dk_td_scorers.py
        continue-on-error: true

      # Multi-book per-game props. Needs ODDS_API_KEY (repo secret); the script
      # exits cleanly when it is absent. Player props bill one credit per event
      # per market, so this is the expensive step on a 500/month free tier.
      # Free request: /v4/sports does not bill a credit but still returns the
      # quota headers, so this reports the real balance without spending one.
      - name: Report Odds API quota
        run: python scripts/check_oddsapi_quota.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        continue-on-error: true

      - name: Scrape The Odds API per-game props
        run: python scripts/fetch_oddsapi_weekly_props.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        continue-on-error: true

      # Game spreads and totals, for scoring D/ST and K -- neither has a prop
      # market worth using (Kalshi posts team-sack/turnover/D-TD markets but
      # leaves them unquoted). Unlike player props these come off the bulk
      # /odds endpoint: one credit per market for the WHOLE slate, so the
      # step costs 2 credits rather than 80.
      - name: Scrape game spreads and totals
        run: python scripts/fetch_game_lines.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        continue-on-error: true

      # Weeks 1-4 averaged. Costs one credit per event (~64 for four weeks),
      # so it is deliberately separate from the single-week pull and skipped
      # when the remaining quota cannot cover it.
      - name: Scrape multi-week averaged props
        if: inputs.multiweek
        run: python scripts/fetch_oddsapi_multiweek.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MULTIWEEK_WEEKS: "4"
        continue-on-error: true

      # Trimmed Sleeper player-ID map (~31 KB) so the page can resolve ANY
      # user's roster in the browser. Sleeper's own dictionary is 14.6 MB.
      - name: Build Sleeper player map
        run: python scripts/build_sleeper_playermap.py
        continue-on-error: true

      # Underdog ADP. Reads a CSV from the EZ Dubs repo, so it only runs when
      # that checkout is available; the committed adp.json stands in otherwise.
      - name: Build Underdog ADP board
        run: python scripts/build_ud_adp.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl-props/data.json nfl-props/clay.json \
                  nfl-props/vegas.json nfl-props/kalshi.json \
                  nfl-props/bovada.json nfl-props/adp.json \
                  nfl-props/weekly.json nfl-props/oddsapi.json \
                  nfl-props/multiweek.json \
                  nfl-props/dk_td.json \
                  nfl-props/gamelines.json \
                  nfl-props/sleeper_players.json
          git diff --staged --quiet || git commit -m "chore: refresh NFL projections [skip ci]"
          git push

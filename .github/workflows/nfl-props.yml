name: NFL Projections Scraper

on:
  workflow_dispatch:   # manual-run only — trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps for Clay PDF parser
        run: pip install pdfplumber

      - name: Scrape FantasyPros consensus projections
        run: python scripts/fetch_nfl_projections.py

      - name: Scrape Mike Clay projections (ESPN PDF)
        run: python scripts/fetch_clay_projections.py
        continue-on-error: true

      # Season-long market lines. Both are best-effort: FanDuel's public endpoint
      # can change without notice, and Kalshi markets close once the season ends.
      - name: Scrape FanDuel season-long props
        run: python scripts/fetch_vegas_season_props.py
        continue-on-error: true

      - name: Scrape Kalshi season-long markets
        run: python scripts/fetch_kalshi_season_props.py
        continue-on-error: true

      # Bovada is the only book here quoting season receiving TDs, which is what
      # lets most first-round RBs score on the Market Points tab.
      - name: Scrape Bovada season-long props
        run: python scripts/fetch_bovada_season_props.py
        continue-on-error: true

      # Per-game markets for the upcoming slate. Kalshi purges settled markets,
      # so this always fetches the next week's games.
      - name: Scrape Kalshi per-game (weekly) props
        run: python scripts/fetch_kalshi_weekly_props.py
        continue-on-error: true

      # DraftKings anytime-TD. Free, no key, but needs Origin+Referer headers
      # or every request 403s. Covers 429 players to Kalshi's 236.
      - name: Scrape DraftKings TD scorers
        run: python scripts/fetch_dk_td_scorers.py
        continue-on-error: true

      # Multi-book per-game props. Needs ODDS_API_KEY (repo secret); the script
      # exits cleanly when it is absent. Player props bill one credit per event
      # per market, so this is the expensive step on a 500/month free tier.
      - name: Scrape The Odds API per-game props
        run: python scripts/fetch_oddsapi_weekly_props.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        continue-on-error: true

      # Weeks 1-4 averaged. Costs one credit per event (~64 for four weeks),
      # so it is deliberately separate from the single-week pull and skipped
      # when the remaining quota cannot cover it.
      - name: Scrape multi-week averaged props
        run: python scripts/fetch_oddsapi_multiweek.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MULTIWEEK_WEEKS: "4"
        continue-on-error: true

      # Sleeper rosters. Public read-only API, no auth. Resolves player IDs
      # server-side because Sleeper's player dictionary is a 14.6 MB download.
      - name: Fetch Sleeper rosters
        run: python scripts/fetch_sleeper_rosters.py
        continue-on-error: true

      # Underdog ADP. Reads a CSV from the EZ Dubs repo, so it only runs when
      # that checkout is available; the committed adp.json stands in otherwise.
      - name: Build Underdog ADP board
        run: python scripts/build_ud_adp.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl-props/data.json nfl-props/clay.json \
                  nfl-props/vegas.json nfl-props/kalshi.json \
                  nfl-props/bovada.json nfl-props/adp.json \
                  nfl-props/weekly.json nfl-props/oddsapi.json \
                  nfl-props/multiweek.json \
                  nfl-props/dk_td.json \
                  nfl-props/sleeper.json
          git diff --staged --quiet || git commit -m "chore: refresh NFL projections [skip ci]"
          git push

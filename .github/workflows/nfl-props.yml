name: NFL Projections Scraper

on:
  # Times are ET in these comments, UTC in the expressions (GitHub schedules in
  # UTC and ignores DST), matching the convention in nfl-beat.yml. Written for
  # EDT = UTC-4; once EST returns in November each run lands an hour earlier in
  # ET, which does not matter for a morning refresh.
  #
  # The cadence follows how books actually post, which is very uneven: almost
  # nothing for Sunday is up on Monday or Tuesday, Wednesday evening is when it
  # starts, and Thursday is the single biggest jump of the week (week 3 went 99
  # to 183 player-games overnight). There is no point refreshing early in the
  # week -- see the coverage note on the page.
  #
  # DO NOT TRUST THESE TIMES TO THE MINUTE. GitHub queues scheduled runs on free
  # tier and the delay is large: measured against this repo's own scrape.yml
  # (declared 0 */6 * * *), actual firings ran 43, 53, 262, 273, 284 and 287
  # minutes late -- a median of about 4.5 hours, worst overnight. The first run of
  # this schedule, declared 02:00 UTC, landed at 08:40.
  #
  # So treat each slot as "some time in the next few hours", not an appointment.
  # That is why there are several Thursday slots rather than one well-placed one:
  # with this much jitter, coverage comes from having more attempts, not from
  # picking a better minute. workflow_dispatch is the only way to get a refresh
  # at a time you choose.
  #
  # Cost: one credit per market per event that has props posted; events with
  # none (next week's games, early in the week) cost nothing. Six markets over a
  # 13-14 game slate measured 78-84 credits a run in week 6 (2026-10-15..18),
  # so eight runs a week is ~650/week, plus ~110 for the Sunday pre-kickoff
  # chain (nfl-kickoff-refresh.yml), ~3,300/month, against the account's
  # 20,000/month (18,161 left on 10-18). The 36 measured on 10-06 was five
  # markets on a thinner board. A scheduled run
  # leaves `inputs` empty, so the multiweek step (gated on `if: inputs.multiweek`,
  # ~64 credits) stays manual-only and never fires on a schedule.
  #
  # If the quota ever does run short, drop the Friday and Saturday runs first:
  # those two days move the least, because Thursday night is when the Sunday
  # props actually open.
  schedule:
    - cron: '0 2 * * 4'      # Wed 10:00pm ET — books start opening Sunday props
    - cron: '0 14 * * 4'     # Thu 10:00am ET — morning pass
    - cron: '0 19 * * 4'     # Thu  3:00pm ET — afternoon pass
    - cron: '0 23 * * 4'     # Thu  7:00pm ET — before TNF; biggest jump of the week
    - cron: '0 14 * * 5'     # Fri 10:00am ET
    - cron: '0 14 * * 6'     # Sat 10:00am ET
    # Sunday is scheduled against MEASURED cron lag, not the nominal time.
    # GitHub's free-tier scheduler ran these 38 min to 6.7 h late over 8 observed
    # runs (median 3.8 h), so a slot needs hours of headroom, not one.
    #
    # The 1pm ET games kick off at 17:00 UTC (week 5's earliest was 17:02:30Z).
    # Against the measured lag the old slots beat that in 3/8 (14:00) and 2/8
    # (16:00) runs -- on 10-11 they fired at 18:35 and 19:46, i.e. 1.6 h and
    # 2.8 h AFTER kickoff, so the "last look before the 1pm games" was a look at
    # games already under way. 06:00 and 10:00 clear it in 8/8.
    - cron: '0 6 * * 0'      # Sun ~2:00am ET nominal — early pass, lands pre-noon
    - cron: '0 10 * * 0'     # Sun ~6:00am ET nominal — last look; 8/8 beat kickoff
    # Pre-kickoff refreshes (20 min before 1pm, 4pm and Sunday night) are not
    # here: cron lag makes that timing impossible. See nfl-kickoff-refresh.yml.
  workflow_dispatch:   # also runnable by hand from the Actions UI
    inputs:
      multiweek:
        description: "Also refresh the weeks-1-4 average (costs ~50 Odds API credits)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps for Clay PDF parser
        run: pip install pdfplumber

      - name: Scrape FantasyPros consensus projections
        run: python scripts/fetch_nfl_projections.py

      - name: Scrape Mike Clay projections (ESPN PDF)
        run: python scripts/fetch_clay_projections.py
        continue-on-error: true

      # Season-long market lines. Both are best-effort: FanDuel's public endpoint
      # can change without notice, and Kalshi markets close once the season ends.
      - name: Scrape FanDuel season-long props
        run: python scripts/fetch_vegas_season_props.py
        continue-on-error: true

      - name: Scrape Kalshi season-long markets
        run: python scripts/fetch_kalshi_season_props.py
        continue-on-error: true

      # Bovada is the only book here quoting season receiving TDs, which is what
      # lets most first-round RBs score on the Market Points tab.
      - name: Scrape Bovada season-long props
        run: python scripts/fetch_bovada_season_props.py
        continue-on-error: true

      # Per-game markets for the upcoming slate. Kalshi purges settled markets,
      # so this always fetches the next week's games.
      - name: Scrape Kalshi per-game (weekly) props
        id: kalshi_weekly
        run: python scripts/fetch_kalshi_weekly_props.py
        continue-on-error: true

      # DraftKings anytime-TD is no longer scraped here (2026-10-26). DraftKings
      # 403s GitHub's runners, so this step only ever failed on CI and
      # dk_td.json had sat since 10-01. The Odds API step below already carries
      # DraftKings' anytime-TD quote, converted the same way. The script stays:
      # fetch_oddsapi_weekly_props.py imports its expected_tds(), and a local
      # run still works for the draft board.

      # Multi-book per-game props. Needs ODDS_API_KEY (repo secret); the script
      # exits cleanly when it is absent. Player props bill one credit per event
      # per market, so this is the expensive step (~80 a run; see Cost above).
      # Free request: /v4/sports does not bill a credit but still returns the
      # quota headers, so this reports the real balance without spending one.
      - name: Report Odds API quota
        run: python scripts/check_oddsapi_quota.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        continue-on-error: true

      - name: Scrape The Odds API per-game props
        id: oddsapi_weekly
        run: python scripts/fetch_oddsapi_weekly_props.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        continue-on-error: true

      # Game spreads and totals, for scoring D/ST and K -- neither has a prop
      # market worth using (Kalshi posts team-sack/turnover/D-TD markets but
      # leaves them unquoted). Unlike player props these come off the bulk
      # /odds endpoint: one credit per market for the WHOLE slate, so the
      # step costs 2 credits rather than 80.
      - name: Scrape game spreads and totals
        id: gamelines
        run: python scripts/fetch_game_lines.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        continue-on-error: true

      # Weeks 1-4 averaged. Costs one credit per event (~64 for four weeks),
      # so it is deliberately separate from the single-week pull and skipped
      # when the remaining quota cannot cover it.
      - name: Scrape multi-week averaged props
        if: inputs.multiweek
        run: python scripts/fetch_oddsapi_multiweek.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MULTIWEEK_WEEKS: "4"
        continue-on-error: true

      # Trimmed Sleeper player-ID map (~31 KB) so the page can resolve ANY
      # user's roster in the browser. Sleeper's own dictionary is 14.6 MB.
      - name: Build Sleeper player map
        id: playermap
        run: python scripts/build_sleeper_playermap.py
        continue-on-error: true

      # Underdog ADP. Reads a CSV from the EZ Dubs repo, so it only runs when
      # that checkout is available; the committed adp.json stands in otherwise.
      - name: Build Underdog ADP board
        run: python scripts/build_ud_adp.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl-props/data.json nfl-props/clay.json \
                  nfl-props/vegas.json nfl-props/kalshi.json \
                  nfl-props/bovada.json nfl-props/adp.json \
                  nfl-props/weekly.json nfl-props/oddsapi.json \
                  nfl-props/multiweek.json \
                  nfl-props/dk_td.json \
                  nfl-props/gamelines.json \
                  nfl-props/sleeper_players.json
          git diff --staged --quiet || git commit -m "chore: refresh NFL projections [skip ci]"
          # Another workflow pushing to master mid-run rejects a bare push and
          # the freshly scraped data dies with the runner. nfl-beat.yml already
          # retried for this; these two did not, and a manual run of props and
          # scrape together lost a complete props refresh (7 files, run
          # 38509417273) to exactly that race. The data had been collected and
          # committed -- only the push failed.
          #
          # These commits touch disjoint paths, so a rebase is safe: props owns
          # nfl-props/, scrape owns arbitrage/.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; rebasing on remote."
            git pull --rebase --autostash origin master
          done
          echo "Push failed after 5 attempts." >&2
          exit 1

      # Start the EZ Dubs site's mirror as soon as this data is live, instead of
      # waiting for its own cron. Its schedule is a guess against GitHub's 1.5-4.5
      # hour cron lag, and on 2026-10-18 that guess left Start/Sit on Saturday's
      # numbers at the Sunday 1pm kickoff while this run's data sat unmirrored.
      #
      # Needs EZDUBS_DISPATCH_TOKEN: a fine-grained token limited to
      # pjmerica/ez-dubs-website with Actions read/write. Without it this step
      # does nothing and the site's hourly Sunday slots still catch up.
      #
      # The mirror reads this repo's PAGES site, which redeploys a minute or two
      # after the push, so dispatching straight away would just copy the old
      # files. Wait until the published weekly.json carries this run's stamp.
      - name: Tell the EZ Dubs site to mirror now
        env:
          GH_TOKEN: ${{ secrets.EZDUBS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "EZDUBS_DISPATCH_TOKEN not set; the site's scheduled mirror will pick this up."
            exit 0
          fi
          want=$(python -c "import json;print(json.load(open('nfl-props/weekly.json')).get('lastUpdated',''))")
          url="https://pjmerica.github.io/AI_Agent_work/nfl-props/weekly.json"
          for i in $(seq 1 20); do
            live=$(curl -s "$url?t=$(date +%s)" | python -c "import json,sys;print(json.load(sys.stdin).get('lastUpdated',''))" 2>/dev/null || true)
            if [ -n "$want" ] && [ "$live" = "$want" ]; then
              echo "Pages is serving this run's data ($want)."
              break
            fi
            echo "Pages not updated yet (live '$live', want '$want'); waiting 30s."
            sleep 30
          done
          gh workflow run nfl-data-pull.yml -R pjmerica/ez-dubs-website \
            && echo "Started the site's mirror." \
            || echo "::warning::Could not start the site's mirror; its schedule will catch up."

      # Every scraper above is continue-on-error, so without this the job goes
      # green even when every source failed. That was survivable while runs were
      # manual and watched; on a schedule it has to speak up.
      #
      # The four board-critical sources fail the job. The season-long ones are
      # reported only: FanDuel and Bovada genuinely drop these markets once the
      # season is under way, which is why they are non-fatal to begin with.
      - name: Report what refreshed
        if: always()
        run: |
          {
            echo "### NFL props refresh"
            echo ""
            echo "| source | outcome |"
            echo "|---|---|"
            echo "| Kalshi per-game | ${{ steps.kalshi_weekly.outcome }} |"
            echo "| Odds API per-game | ${{ steps.oddsapi_weekly.outcome }} |"
            echo "| Game lines | ${{ steps.gamelines.outcome }} |"
            echo "| Sleeper player map | ${{ steps.playermap.outcome }} |"
            echo ""
            echo "#### Data on disk after this run"
            echo ""
            echo '```'
            python scripts/report_data_state.py || echo "(report failed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail the job if a source the board cannot do without did not succeed.
          bad=""
          [ "${{ steps.kalshi_weekly.outcome }}" = "success" ] || bad="$bad kalshi-per-game"
          [ "${{ steps.oddsapi_weekly.outcome }}" = "success" ] || bad="$bad odds-api-per-game"
          [ "${{ steps.gamelines.outcome }}" = "success" ] || bad="$bad game-lines"
          [ "${{ steps.playermap.outcome }}" = "success" ] || bad="$bad sleeper-player-map"
          if [ -n "$bad" ]; then
            echo "Board-critical source(s) failed:$bad" >&2
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Failed:**$bad" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
